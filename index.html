<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIZ DE IDENTIFICACIÓN DE PELIGROS, EVALUACIÓN DE RIESGOS Y DETERMINACIÓN DE CONTROL</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-area">
                <img src="logo-inia.png" alt="INIA" class="logo-inia">
                <div class="logo-texto">
                    <h1>Estación Experimental Agraria Illpa Puno 2026</h1>
                    <p>EEA Illpa - Puno 2026</p>
                </div>
            </div>
            <div class="header-info">
                <span id="contador-docs">0 documentos</span>
            </div>
        </div>
    </header>

    <main class="galeria-container">
        <div class="galeria-header">
            <h2>Documentos disponibles</h2>
            <p>Selecciona un Puesto de Trabajo para visualizarlo</p>
        </div>
        <section id="galeria" class="galeria"></section>
    </main>

    <section id="visor" class="visor oculto">
        <div class="visor-header">
            <button class="btn-volver" onclick="cerrarVisor()">
                <span>←</span> Volver
            </button>
            <h2 id="titulo-libro">Documento</h2>
            <div class="visor-info">
                <span id="indicador-pagina">1 / 1</span>
            </div>
        </div>
        
        <div class="zoom-bar">
            <button class="zoom-btn" onclick="zoomOut()" title="Reducir">−</button>
            <span id="zoom-nivel" class="zoom-nivel">100%</span>
            <button class="zoom-btn" onclick="zoomIn()" title="Ampliar">+</button>
            <button class="zoom-btn zoom-reset" onclick="zoomReset()" title="Ajustar a pantalla">⤢</button>
        </div>

        <div class="pdf-wrapper" id="pdf-wrapper">
            <button class="nav-btn nav-prev" onclick="paginaAnterior()" id="btn-prev">‹</button>
            <div id="pdf-viewer" class="pdf-viewer">
                <div id="pdf-page-container" class="pdf-page-container"></div>
            </div>
            <button class="nav-btn nav-next" onclick="paginaSiguiente()" id="btn-next">›</button>
        </div>
        
        <div class="controles">
            <div class="progreso-container">
                <div class="progreso-barra">
                    <div id="progreso-relleno" class="progreso-relleno"></div>
                </div>
            </div>
            <div class="controles-botones">
                <button class="btn-control" onclick="paginaAnterior()" id="btn-ant">
                    <span>←</span> Anterior
                </button>
                <button class="btn-control" onclick="paginaSiguiente()" id="btn-sig">
                    Siguiente <span>→</span>
                </button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
